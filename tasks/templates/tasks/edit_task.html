<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
        >

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'task_list' %}">Back to Todo List</a>

</body>
</html>
